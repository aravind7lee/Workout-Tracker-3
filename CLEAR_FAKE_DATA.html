<!DOCTYPE html>
<html>
<head>
    <title>Clear Fake Workout Data</title>
</head>
<body>
    <h1>Clear All Fake Workout Data</h1>
    <button onclick="clearAllFakeData()">Clear Fake Data</button>
    <div id="result"></div>
    
    <script>
        function clearAllFakeData() {
            // Clear all fake workout data
            localStorage.removeItem('completedWorkouts');
            localStorage.removeItem('workouts');
            localStorage.removeItem('workoutHistory');
            localStorage.removeItem('recentWorkouts');
            localStorage.removeItem('workoutPlans');
            localStorage.removeItem('recentMeals');
            
            document.getElementById('result').innerHTML = '<p style="color: green;">✅ All fake workout data cleared! Refresh your app.</p>';
            console.log('🧹 All fake workout data cleared');
        }
        
        // Auto-clear on page load
        clearAllFakeData();
    </script>
</body>
</html>
