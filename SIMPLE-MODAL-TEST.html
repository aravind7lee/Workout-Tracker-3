<!DOCTYPE html>
<html>
<head>
    <title>WorkoutSetupModal Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: white; }
        .btn { padding: 10px 20px; background: #6366f1; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #5855eb; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .modal-content { background: #2d3748; padding: 20px; border-radius: 10px; max-width: 500px; width: 90%; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>🎯 WorkoutSetupModal Test</h1>
    <p>This tests if the modal functionality works correctly.</p>
    
    <button class="btn" onclick="showModal()">🎯 Start Workout (Test)</button>
    
    <div id="testModal" class="modal hidden">
        <div class="modal-content">
            <h2>🎯 Setup Your Workout</h2>
            <p>Configure your workout parameters before starting</p>
            
            <div style="margin: 20px 0;">
                <label>Target Sets: <input type="number" value="3" min="1" max="10"></label><br><br>
                <label>Target Reps: <input type="number" value="12" min="1" max="50"></label><br><br>
                <label>Weight (kg): <input type="number" value="20" min="0" step="0.5"></label><br><br>
                <label>Rest Time (sec): <input type="number" value="60" min="30" max="600"></label><br><br>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn" onclick="hideModal()" style="background: #6b7280;">Cancel</button>
                <button class="btn" onclick="startWorkout()">🚀 Start Workout</button>
            </div>
        </div>
    </div>
    
    <div id="result" style="margin-top: 20px; padding: 10px; background: #065f46; border-radius: 5px; display: none;">
        <h3>✅ Workout Started!</h3>
        <p>Modal worked correctly. Now the workout timer would begin.</p>
    </div>

    <script>
        function showModal() {
            console.log('🎯 Opening workout setup modal');
            document.getElementById('testModal').classList.remove('hidden');
        }
        
        function hideModal() {
            console.log('❌ Closing workout setup modal');
            document.getElementById('testModal').classList.add('hidden');
        }
        
        function startWorkout() {
            console.log('🚀 Starting workout with configuration');
            hideModal();
            document.getElementById('result').style.display = 'block';
            
            // Simulate navigation to StartWorkout component
            setTimeout(() => {
                alert('✅ This would now navigate to StartWorkout component with timer!');
            }, 500);
        }
        
        // Test on page load
        console.log('📝 Modal test page loaded');
    </script>
</body>
</html>
